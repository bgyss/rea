[tools]
# Matches .nvmrc and package.json packageManager.
node = "24.18.0"

[tasks.check]
description = "Cached static checks and tests affected since origin/main"
run = "npm run check:changed"

[tasks.verify-ghidra]
description = "Real Ghidra lanes: native fixtures, raw images, compiled-function compare and Function ID signatures (run inside `nix develop`)"
run = [
  "npm run verify:ghidra",
  "npm run verify:ghidra:raw",
  "npm run verify:ghidra:compare",
  "npm run verify:ghidra:signatures",
  "npm run verify:ghidra:text",
]
